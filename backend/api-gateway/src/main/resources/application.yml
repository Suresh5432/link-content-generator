server:
  port: 8084

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD:linkpassword}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: link-service
              uri: ${LINK_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/links/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/users/**

management:
  endpoints:
    web:
      exposure:
        include:  health,info,prometheus,metrics


  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  metrics:
    tags:
      applications: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true
logging:
  level:
    root: INFO
    com.linklens.apigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
