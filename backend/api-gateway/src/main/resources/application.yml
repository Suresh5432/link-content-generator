server:
  shutdown: graceful
  port: 8084

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: link-service
              uri: ${LINK_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/links/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/users/**
            - id: digital-footprint-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/digital-footprint,/api/v1/digital-footprint/**
            - id: privacy-request-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/privacy-requests,/api/v1/privacy-requests/**
            - id: cookie-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/cookies,/api/v1/cookies/**
            - id: browser-integration-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/browser-integrations,/api/v1/browser-integrations/**
            - id: privacy-preference-service
              uri: ${USER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/privacy-preferences,/api/v1/privacy-preferences/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**
            - id: summary-service
              uri: ${SUMMARY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/summaries,/api/v1/summaries/**
            - id: website-analysis-report-service
              uri: ${SUMMARY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/website-analysis-reports,/api/v1/website-analysis-reports/**
            - id: privacy-assistant-service
              uri: ${SUMMARY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/privacy-assistant,/api/v1/privacy-assistant/**
            - id: website-analysis-service
              uri: ${EXTRACTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/website-analyses,/api/v1/website-analyses/**
          http-client:
            connect-timeout: 3s
            read-timeout: 15s

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include:  health,info,prometheus,metrics


  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.linklens.apigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:link-context-gateway}
