server:
  port:
    8086
spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:notification_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:linkuser}
    password: ${RABBITMQ_PASSWORD:linkpassword}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:katravathsuresh8917@gmail.com}
    password: ${SMTP_PASSWORD:folq pxvf aezs pyym}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          user-service:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:link-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRECT:}
            authorization-grant-type: client_credentials
            scope:
              -  users.read
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/link-context/protocol/openid-connect/token}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.linklens.notificationservice: INFO
    org.springframework.amqp: INFO
    root: info


notification:
  email:
    from: ${SMTP_USERNAME:katravathsuresh8917@gmail.com}
  worker:
    poll-interval-ms: 10000
    batch-size: 50
