server:
  shutdown: graceful
  port: 8083

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}
      client:
        registration:
          extraction-service:
            provider: keycloak
            client-id: ${EXTRACTION_CLIENT_ID}
            client-secret: ${EXTRACTION_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - extraction.read
              - openid
          user-service:
            provider: keycloak
            client-id: ${USER_SERVICE_CLIENT_ID:summarization-service}
            client-secret: ${USER_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope:
              - users.read
              - openid
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/link-context/protocol/openid-connect/token}
  application:
    name: summarization-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
  datasource:
    url: ${SUMMARY_DB_URL:jdbc:postgresql://localhost:5432/summary_db}
    username: ${SUMMARY_DB_USERNAME:summary_user}
    password: ${SUMMARY_DB_PASSWORD:${SERVICE_DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        max-concurrency: 3
        concurrency: 1
        observation-enabled: true
    template:
      observation-enabled: true
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
summarization:
  content-service:
    base-url: ${EXTRACTION_SERVICE_URL:http://localhost:8082}
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8085}
  extraction-service:
    base-url: ${EXTRACTION_SERVICE_URL:http://localhost:8082}
  ai:
    provider: ${AI_PROVIDER:ollama}
    model: ${AI_MODEL:qwen2.5:3b}
    max-input-characters: 50000
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    max-output-characters: ${AI_MAX_OUTPUT_CHARACTERS:10000}
    gemini-api-key: ${GEMINI_API_KEY:}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

  reading:
    words-per-minite: 200
  outbox:
    fixed-delay-ms: 1000
    confirm-timeout-seconds: 5


logging:
  structured:
    format:
      console: logstash

security:
  jwt:
    expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:summarization-service}
