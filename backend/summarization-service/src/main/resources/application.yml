server:
  port: 8083

spring:
  security:
    oauth2:
      client:
        registration:
          extraction-service:
            provider: keycloak
            client-id: ${EXTRACTION_CLIENT_ID}
            client-secret: ${EXTRACTION_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              -  extraction.read
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/link-context/openid-connect/token}
  application:
    name: summarization-service
  datasource:
    url: ${SUMMARY_DB_URL:jdbc:postgresql://localhost:5432/summary_db}
    username: ${SUMMARY_DB_USERNAME:summary_user}
    password: ${SUMMARY_DB_PASSWORD:summary_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:linkuser}
    password: ${RabbitMQ_PASSWORD:linkpassword}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        max-concurrency: 5
        concurrency: 2
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
summarization:
  content-service:
    base-url: ${EXTRACTION_SERVICE_URL:http://localhost:8082}
  ai:
    provider: ${AI_PROVIDER:gemini}
    model: ${AI_MODEL:gemini-3.8-flash}
    max-input-characters: 50000
    timeour-seconds: 60

  reading:
    words-per-minite: 200
  outbox:
    fixed-delay-ms: 1000
    confirm-timeout-seconds: 5