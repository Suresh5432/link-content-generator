server:
  shutdown: graceful
  port: 8082

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: extraction-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}
      client:
        registration:
          extraction-service:
            client-id: ${EXTRACTION_CLIENT_ID}



  datasource:
    url: ${EXTRACTION_DB_URL:jdbc:postgresql://localhost:5432/extraction_db}
    username: ${EXTRACTION_DB_USERNAME:extraction_user}
    password: ${EXTRACTION_DB_PASSWORD:${SERVICE_DB_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 5
        observation-enabled: true
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    virtual-host: /
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}


extraction:
  fetch:
    connect-timeout-seconds: 5
    request-timeout-seconds: 15
    max-response-size-bytes: 5242880
    max-redirects: 5
    user-agent: LinkContextBot/1.0
  outbox:
    fixed-delay-ms: 1000
    confirm-timeout-seconds: 5


logging:
  structured:
    format:
      console: logstash
