spring:
  application:
   name: link-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}
  datasource:
    url: ${LINK_DB_URL:jdbc:postgresql://localhost:5432/link_db}
    username: ${LINK_DB_USERNAME:link_user}
    password: ${LINK_DB_PASSWORD:link_dev_password}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:linkuser}
    password: ${RABBITMQ_PASSWORD:linkpassword}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

server:
  port: 8081

logging:
  level:
    root: info

outbox:
  publisher:
    fixed-delay: 1000
    confirm-timeout: 5s

