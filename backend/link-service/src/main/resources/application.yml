spring:
  application:
   name: link-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}
  datasource:
    url: ${LINK_DB_URL:jdbc:postgresql://localhost:5432/link_db}
    username: ${LINK_DB_USERNAME:link_user}
    password: ${LINK_DB_PASSWORD:link_dev_password}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:linkuser}
    password: ${RABBITMQ_PASSWORD:linkpassword}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

server:
  port: 8081

