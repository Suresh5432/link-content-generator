server:
  shutdown: graceful
  port: 8085

security:
  internal-client-ids: ${INTERNAL_USER_LOOKUP_CLIENT_IDS:extraction-service,summarization-service,notification-service,link-service}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/link-context}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    publisher-confirm-type: correlated
    publisher-returns: true
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${USER_DB_USERNAME:user_user}
    password: ${USER_DB_PASSWORD:${SERVICE_DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true


digital-footprint:
  events:
    exchange: ${PRIVACY_EVENTS_EXCHANGE:link.events}
  outbox:
    fixed-delay-ms: ${PRIVACY_OUTBOX_FIXED_DELAY_MS:1000}
    initial-delay-ms: ${PRIVACY_OUTBOX_INITIAL_DELAY_MS:5000}
    confirm-timeout-seconds: ${PRIVACY_OUTBOX_CONFIRM_TIMEOUT_SECONDS:5}
    batch-size: ${PRIVACY_OUTBOX_BATCH_SIZE:20}
  reminders:
    fixed-delay-ms: ${PRIVACY_REMINDERS_FIXED_DELAY_MS:3600000}
    initial-delay-ms: ${PRIVACY_REMINDERS_INITIAL_DELAY_MS:60000}

logging:
  structured:
    format:
      console: logstash
