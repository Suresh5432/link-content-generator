global:
  resolve_timeout: 5m
  smtp_smarthost: "${ALERT_SMTP_HOST}:${ALERT_SMTP_PORT}"
  smtp_from: "${ALERT_SMTP_FROM}"
  smtp_auth_username: "${ALERT_SMTP_USERNAME}"
  smtp_auth_password_file: "/etc/alertmanager/secrets/gmail-app-password"
  smtp_require_tls: true

route:
  receiver: email-notifications
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email-notifications
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
