global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "link_service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "extraction-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docket.internal:8082"]

  - job_name: "summarization-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8083"]