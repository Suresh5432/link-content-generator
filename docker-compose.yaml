
services:

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: lcg-alertmanager
    restart: unless-stopped
    environment:
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-${SMTP_HOST:-smtp.gmail.com}}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-${SMTP_PORT:-587}}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-${SMTP_USERNAME:?SMTP_USERNAME is required}}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-${SMTP_USERNAME:?SMTP_USERNAME is required}}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${SMTP_USERNAME:?SMTP_USERNAME is required}}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infrastructure/monitoring/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - ./infrastructure/monitoring/alertmanager/secrets/gmail-app-password:/etc/alertmanager/secrets/gmail-app-password:ro
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18
    container_name: lcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      LINK_DB_PASSWORD: ${LINK_DB_PASSWORD:?LINK_DB_PASSWORD is required}
      EXTRACTION_DB_PASSWORD: ${EXTRACTION_DB_PASSWORD:?EXTRACTION_DB_PASSWORD is required}
      SUMMARY_DB_PASSWORD: ${SUMMARY_DB_PASSWORD:?SUMMARY_DB_PASSWORD is required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data-network

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: lcg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - messaging-network

  redis:
    image: redis:7.4-alpine
    container_name: lcg-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - data-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: lcg-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:5173/auth}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - identity-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: lcg-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      api-gateway:
        condition: service_healthy
      link-service:
        condition: service_healthy
      extraction-service:
        condition: service_healthy
      summarization-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - messaging-network

  grafana:
    image: grafana/grafana:12.1.1
    container_name: lcg-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    container_name: lcg-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  ollama:
    image: ollama/ollama:0.12.6
    container_name: lcg-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-model-init:
    image: ollama/ollama:0.12.6
    container_name: lcg-ollama-model-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${AI_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    image: link-context/api-gateway:local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    ports:
      - "8084:8084"
    environment: &app-environment
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI_DOCKER:-http://localhost:5173/auth/realms/link-context}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/link-context/protocol/openid-connect/certs
      KEYCLOAK_EXPECTED_AUDIENCE: ${KEYCLOAK_EXPECTED_AUDIENCE:-link-context-gateway}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LINK_SERVICE_URL: http://link-service:8081
      USER_SERVICE_URL: http://user-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      SUMMARY_SERVICE_URL: http://summarization-service:8083
      EXTRACTION_SERVICE_URL: http://extraction-service:8082
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      link-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      extraction-service:
        condition: service_healthy
    networks: [default, data-network, messaging-network, identity-network]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8084}
        VITE_KEYCLOAK_REALM: ${FRONTEND_KEYCLOAK_REALM:-link-context}
        VITE_KEYCLOAK_CLIENT_ID: ${FRONTEND_KEYCLOAK_CLIENT_ID:-link-context-web}
    image: link-context/frontend:local
    container_name: lcg-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - default
      - identity-network

  link-service:
    build:
      context: .
      dockerfile: backend/link-service/Dockerfile
    image: link-context/link-service:local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    expose: ["8081"]
    environment:
      <<: *app-environment
      SERVER_PORT: 8081
      LINK_DB_URL: jdbc:postgresql://postgres:5432/link_db
      LINK_DB_USERNAME: link_user
      LINK_DB_PASSWORD: ${LINK_DB_PASSWORD}
      KEYCLOAK_EXPECTED_AUDIENCE: ${LINK_SERVICE_EXPECTED_AUDIENCE:-link-service}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [default, data-network, messaging-network, identity-network]

  extraction-service:
    build:
      context: .
      dockerfile: backend/extraction-service/Dockerfile
    image: link-context/extraction-service:local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    expose: ["8082"]
    environment:
      <<: *app-environment
      SERVER_PORT: 8082
      EXTRACTION_DB_URL: jdbc:postgresql://postgres:5432/extraction_db
      EXTRACTION_DB_USERNAME: extraction_user
      EXTRACTION_DB_PASSWORD: ${EXTRACTION_DB_PASSWORD}
      EXTRACTION_CLIENT_ID: ${EXTRACTION_CLIENT_ID:-extraction-service}
      SECURITY_JWT_EXPECTED_AUDIENCE: ${EXTRACTION_SERVICE_EXPECTED_AUDIENCE:-extraction-service}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [default, data-network, messaging-network, identity-network]

  summarization-service:
    build:
      context: .
      dockerfile: backend/summarization-service/Dockerfile
    image: link-context/summarization-service:local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    expose: ["8083"]
    environment:
      <<: *app-environment
      SERVER_PORT: 8083
      SUMMARY_DB_URL: jdbc:postgresql://postgres:5432/summary_db
      SUMMARY_DB_USERNAME: summary_user
      SUMMARY_DB_PASSWORD: ${SUMMARY_DB_PASSWORD}
      EXTRACTION_SERVICE_URL: http://extraction-service:8082
      EXTRACTION_CLIENT_ID: ${EXTRACTION_CLIENT_ID:-extraction-service}
      EXTRACTION_CLIENT_SECRET: ${EXTRACTION_CLIENT_SECRET:?EXTRACTION_CLIENT_SECRET is required}
      USER_SERVICE_URL: http://user-service:8085
      USER_SERVICE_CLIENT_ID: ${USER_SERVICE_CLIENT_ID:-summarization-service}
      USER_SERVICE_CLIENT_SECRET: ${USER_SERVICE_CLIENT_SECRET:-}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/auth/realms/link-context/protocol/openid-connect/token
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KEYCLOAK_EXPECTED_AUDIENCE: ${SUMMARIZATION_SERVICE_EXPECTED_AUDIENCE:-summarization-service}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      extraction-service:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    networks: [default, data-network, messaging-network, identity-network]

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    image: link-context/user-service:local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    expose: ["8085"]
    environment:
      <<: *app-environment
      SERVER_PORT: 8085
      USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_USERNAME: user_user
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      INTERNAL_USER_LOOKUP_CLIENT_IDS: ${INTERNAL_USER_LOOKUP_CLIENT_IDS:-notification-service,link-service,summarization-service}
      KEYCLOAK_EXPECTED_AUDIENCE: ${USER_SERVICE_EXPECTED_AUDIENCE:-user-service}
      SECURITY_JWT_EXPECTED_AUDIENCE: ${USER_SERVICE_EXPECTED_AUDIENCE:-user-service}
      GOOGLE_EMAIL_DISCOVERY_ENABLED: ${GOOGLE_EMAIL_DISCOVERY_ENABLED:-false}
      GOOGLE_EMAIL_DISCOVERY_ENCRYPTION_KEY: ${GOOGLE_EMAIL_DISCOVERY_ENCRYPTION_KEY:-}
      GOOGLE_EMAIL_DISCOVERY_FRONTEND_URL: ${GOOGLE_EMAIL_DISCOVERY_FRONTEND_URL:-http://localhost:5173/digital-footprint}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8084/api/v1/digital-footprint/connected-email/oauth/google/callback}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [default, data-network, messaging-network, identity-network]

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    image: link-context/notification-service:local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    expose: ["8086"]
    environment:
      <<: *app-environment
      SERVER_PORT: 8086
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification_user
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_CLIENT_ID: ${NOTIFICATION_CLIENT_ID:-notification-service}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?NOTIFICATION_CLIENT_SECRET is required}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/auth/realms/link-context/protocol/openid-connect/token
      USER_SERVICE_BASE_URL: http://user-service:8085
      KEYCLOAK_EXPECTED_AUDIENCE: ${NOTIFICATION_SERVICE_EXPECTED_AUDIENCE:-notification-service}
      SECURITY_JWT_EXPECTED_AUDIENCE: ${NOTIFICATION_SERVICE_EXPECTED_AUDIENCE:-notification-service}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks: [default, data-network, messaging-network, identity-network]

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
  ollama_data:

networks:
  data-network:
  messaging-network:
  identity-network:
