<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link Context footprint</title>
  <style>
    :root { color-scheme: light; }
    body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 14px; width: 380px; background: #fafafa; color: #1d1d1f; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #555; }
    .notice { background: #fff8ed; border: 1px solid #f1d9b0; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #555; margin: 8px 0 3px; }
    input[type=text], input[type=url] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 8px; }
    button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid #1d1d1f; background: #1d1d1f; color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: #1d1d1f; }
    button.danger { background: #fff; color: #991b1b; border-color: #991b1b; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 220px; overflow: auto; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
    li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; border-bottom: 1px solid #f0f0f0; font-size: 12.5px; }
    li:last-child { border-bottom: 0; }
    .meta { color: #666; font-size: 11.5px; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 999px; background: #eee; font-size: 10.5px; margin-left: 4px; }
    .tag.warn { background: #fff1dd; color: #92400e; }
    .status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>Link Context — cookies</h1>
  <p>Review metadata for sites you allow. Values are never read or uploaded.</p>
  <div class="notice">Deleting a cookie can sign you out or reset preferences. Only selected cookies are removed, in this browser profile.</div>

  <label for="domain">Domain</label>
  <div class="row"><input id="domain" type="text" placeholder="example.com" /><button id="scan" class="secondary">Scan</button><button id="current" class="secondary">This site</button></div>

  <label for="api">Link Context API base URL</label>
  <input id="api" type="url" placeholder="http://localhost:8084" />
  <label for="token">Access token (stored for this browser session only)</label>
  <input id="token" type="text" placeholder="Paste a short-lived access token" autocomplete="off" />

  <div class="row" style="margin-top:10px">
    <button id="delete">Delete selected</button>
    <button id="sync" class="secondary">Sync metadata</button>
  </div>
  <div id="status" class="status" role="status"></div>
  <ul id="list"></ul>

  <script src="popup.js"></script>
</body>
</html>
