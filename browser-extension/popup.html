<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link Context Footprint</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; width: 380px; color: #1a1a18; background: #faf9f6; }
      header { padding: 14px 16px; border-bottom: 1px solid #e5e3dc; }
      h1 { margin: 0; font-size: 15px; }
      p, label, small { font-size: 12px; color: #555; }
      main { padding: 12px 16px 16px; display: grid; gap: 10px; }
      input, button { font: inherit; }
      input[type=text], input[type=url], input[type=password] { width: 100%; padding: 8px; border: 1px solid #d5d2ca; border-radius: 8px; box-sizing: border-box; }
      button { padding: 8px 10px; border-radius: 8px; border: 1px solid #cfcabf; background: #fff; cursor: pointer; }
      button.primary { background: #1a1a18; color: #fff; border-color: #1a1a18; }
      ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; border: 1px solid #e5e3dc; border-radius: 8px; background: #fff; }
      li { padding: 8px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: start; }
      li:last-child { border-bottom: 0; }
      .meta { color: #666; font-size: 11px; }
      .tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #eceae4; }
      .warn { background: #f5e4d8; color: #7a3412; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .danger { border-color: #f0c8c8; color: #8b2020; }
      #status { min-height: 18px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Link Context — Digital Footprint</h1>
      <p>Metadata only. Cookie values, session tokens and storage values never leave this browser.</p>
    </header>
    <main>
      <label>Domain <input id="domain" type="text" placeholder="example.com" /></label>
      <div class="row">
        <button id="current">Use current site</button>
        <button id="scan" class="primary">Scan cookies</button>
      </div>
      <ul id="list"><li>No cookies scanned yet.</li></ul>
      <div class="row">
        <button id="delete">Delete selected</button>
        <button id="clear-domain" class="danger">Clear domain cookies</button>
      </div>
      <button id="inspect-storage">Inspect browser storage</button>
      <button id="clear-storage" class="danger">Clear browser storage for this site</button>
      <div id="storage" class="meta"></div>
      <hr />
      <label>Link Context API <input id="api" type="url" placeholder="http://localhost:8084" /></label>
      <label>Access token <input id="token" type="password" placeholder="Paste a short-lived token" /></label>
      <div class="row">
        <button id="authorize-origin">Authorize API origin</button>
        <button id="sync" class="primary">Sync metadata</button>
      </div>
      <div id="status" aria-live="polite"></div>
      <small>Server-side account data is never deleted by browser cleanup. Use privacy requests for that.</small>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
